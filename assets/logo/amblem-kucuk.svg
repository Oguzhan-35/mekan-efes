<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Mekan Efes amblemi">
  <title>Mekan Efes — küçük boyut amblemi</title>
  <!--
    KÜÇÜK BOYUT AMBLEMİ  (favicon, uygulama simgesi, 32px altı)
    Ana amblemin sadeleştirilmiş hâli: "ME" harfleri 20px'te okunamadığı
    için çıkarıldı, geriye kemer silueti ve kaide kaldı. Çizgiler
    kalınlaştırıldı ki küçük ölçekte kaybolmasın.
  -->
  <rect width="100" height="100" rx="22" fill="#0A2027"/>
  <g fill="none" stroke="#C9A24B" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <path d="M26 76 V50 A24 24 0 0 1 74 50 V76"/>
    <path d="M20 76 H80"/>
  </g>
</svg>
